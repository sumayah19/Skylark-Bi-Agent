<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skylark BI · Console</title>
<style>
  :root {
    --bg: #0b0f0e;
    --panel: #121917;
    --line: #223330;
    --text: #dfe8e4;
    --muted: #7d9490;
    --accent: #ff9a3c;
    --accent-dim: #7a4f22;
    --mono: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
    --sans: 'IBM Plex Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
  }
  header {
    border-bottom: 1px solid var(--line);
    padding: 14px 20px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  header .brand {
    font-family: var(--mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 13px;
    color: var(--muted);
  }
  header .brand b { color: var(--accent); font-weight: 600; }
  #status {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--line);
    padding: 3px 8px;
    border-radius: 3px;
  }
  #status.mock { color: var(--accent); border-color: var(--accent-dim); }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px 8px;
    max-width: 780px;
    width: 100%;
    margin: 0 auto;
  }
  .msg { margin-bottom: 22px; max-width: 640px; }
  .msg.user { margin-left: auto; }
  .msg .role {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .msg.user .role { text-align: right; }
  .bubble {
    padding: 12px 15px;
    border-radius: 4px;
    line-height: 1.55;
    font-size: 14.5px;
    white-space: pre-wrap;
  }
  .msg.agent .bubble { background: var(--panel); border: 1px solid var(--line); border-left: 2px solid var(--accent); }
  .msg.user .bubble { background: #16201d; border: 1px solid var(--line); }
  .msg.agent .bubble strong { color: var(--accent); }
  #suggestions {
    max-width: 780px; margin: 0 auto; padding: 0 20px 12px;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .chip {
    font-family: var(--mono); font-size: 12px; color: var(--muted);
    border: 1px solid var(--line); background: transparent; border-radius: 3px;
    padding: 6px 10px; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent-dim); color: var(--text); }
  form {
    border-top: 1px solid var(--line);
    padding: 14px 20px 20px;
    display: flex;
    gap: 10px;
    max-width: 780px;
    width: 100%;
    margin: 0 auto;
  }
  textarea {
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14.5px;
    padding: 11px 13px;
    border-radius: 4px;
    height: 46px;
  }
  textarea:focus { outline: none; border-color: var(--accent-dim); }
  button[type="submit"] {
    font-family: var(--mono);
    background: var(--accent);
    color: #1a1200;
    border: none;
    padding: 0 20px;
    border-radius: 4px;
    font-size: 13px;
    letter-spacing: 0.03em;
    cursor: pointer;
  }
  button[type="submit"]:disabled { opacity: 0.5; cursor: default; }
  .typing { color: var(--muted); font-family: var(--mono); font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="brand"><b>SKYLARK</b> / BI CONSOLE</div>
  <div id="status">connecting…</div>
</header>

<main id="log"></main>
<div id="suggestions"></div>

<form id="form">
  <textarea id="input" placeholder="Ask about pipeline, sectors, execution, billing…" required></textarea>
  <button type="submit">Ask</button>
</form>

<script src="app.js"></script>
</body>
</html>
